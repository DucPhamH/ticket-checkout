name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tc
          POSTGRES_PASSWORD: tc
          POSTGRES_DB: tc
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tc -d tc"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://tc:tc@localhost:5432/tc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build -w @tc/shared
      - run: npm run db:generate -w @tc/api
      - run: npm run lint
      - run: npm run typecheck
      # The test suite creates, migrates and seeds its own tc_test database.
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
